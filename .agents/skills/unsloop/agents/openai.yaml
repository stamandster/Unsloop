interface:
  display_name: "Unsloop"
  short_description: "Author-led writing, web content, evidence, and audits"
  default_prompt: "Use $unsloop to plan, draft, revise, review, audit, research, validate, maintain, or package writing and content—including websites—while preserving author control, human voice, governed Style Direction, evidence provenance, portable continuity, and honest readiness. Before persistent writing, resolve Immutable versions or Overwrite current. Keep Audit non-mutating, separate style channels, separate content findings from technical or behavioral proof, and never turn style into an AI-authorship probability."
